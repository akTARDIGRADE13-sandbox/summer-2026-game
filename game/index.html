    <main class="page-container">
      <h1>Dodge Game</h1>

      <p>敵を避けながらアイテムを集めて、できるだけ高いスコアを目指します。</p>

      <div id="game-container"></div>

      <section class="game-info">

          <dt>移動</dt>

          <dd>Space</dd>

          <dt>リスタート</dt>
          <dd>R</dd>
        </dl>

      <section class="game-info">

          このゲームでは、p5.jsによる描画、キーボード入力、

        <p>
          <a href="../docs/#sample-game">コードの解説を読む</a>
